<title>사주 노트</title>

<style>
/* Layout: a 만세력 notebook — people down the left margin, the selected person's 원국 as a four-column ledger, and a running conversation under it. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #e9ebf0;
  --ink: #1a1e2b;
  --muted: #5b6172;
  --line: #d6d9e1;
  --accent: #2f4a8a;      /* 쪽빛 */
  --accent-ink: #ffffff;
  --accent-soft: #e3e8f4;
  --seal: #b8322a;        /* 인주 */
  --warn: #8a5a00;
  --warn-bg: #fbf1dc;
  --wood: #2f7a4a;  --wood-bg: #e2f1e6;
  --fire: #c0392b;  --fire-bg: #fbe4e1;
  --earth: #9a6b12; --earth-bg: #f6ecd5;
  --metal: #6b7280; --metal-bg: #eceef1;
  --water: #1f4e8c; --water-bg: #e0e9f6;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1a1d27; --surface-2: #232734; --ink: #e7e9ef; --muted: #9da3b4; --line: #323748;
    --accent: #8ea8ec; --accent-ink: #0e1426; --accent-soft: #232c45; --seal: #f0786c; --warn: #f1c46b; --warn-bg: #3a2f18;
    --wood: #6fcf93; --wood-bg: #1b3326; --fire: #f2867a; --fire-bg: #3d211f; --earth: #e2b55a; --earth-bg: #362c17;
    --metal: #b5bcc9; --metal-bg: #2a2e38; --water: #86aef0; --water-bg: #1b2a44; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1a1d27; --surface-2: #232734; --ink: #e7e9ef; --muted: #9da3b4; --line: #323748;
  --accent: #8ea8ec; --accent-ink: #0e1426; --accent-soft: #232c45; --seal: #f0786c; --warn: #f1c46b; --warn-bg: #3a2f18;
  --wood: #6fcf93; --wood-bg: #1b3326; --fire: #f2867a; --fire-bg: #3d211f; --earth: #e2b55a; --earth-bg: #362c17;
  --metal: #b5bcc9; --metal-bg: #2a2e38; --water: #86aef0; --water-bg: #1b2a44; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 56px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.seal { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 2px solid var(--seal); color: var(--seal); border-radius: 6px; font-family: var(--font-display); font-weight: 900; font-size: 15px; line-height: 1; transform: rotate(-4deg); }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--seal); }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* people */
.people { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.people-list { display: grid; gap: 6px; }
@media (max-width: 820px) {
  .people { position: static; }
  .people-list { display: flex; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .person { flex: 0 0 auto; min-width: 150px; scroll-snap-align: start; }
}
.person { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left; padding: 9px 11px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.person:hover { border-color: var(--accent); }
.person[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.person .dm { grid-row: span 2; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 20px; }

.person .sub { font-size: 12px; color: var(--muted); }

.note { font-size: 12px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.main { display: grid; gap: 18px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.head .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.rel { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; }
.linkbtn { border: 0; background: none; padding: 2px 4px; color: var(--accent); font-weight: 500; font-size: 14px; }

.linkbtn.danger { color: var(--seal); }
.example { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.warns { display: grid; gap: 4px; }
.warns p { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 6px 12px; font-size: 13px; }

/* 원국 ledger */
.ledger-scroll { overflow-x: auto; }
.ledger { display: grid; grid-template-columns: 50px repeat(4, minmax(54px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 280px; }
@media (max-width: 480px) { .panel { padding: 14px 12px; } .ledger > div { padding: 5px 2px; font-size: 12px; } }
.ledger > div { padding: 6px 4px; text-align: center; border-top: 1px solid var(--line); font-size: 13px; display: grid; place-items: center; }
.ledger > .rh { background: var(--surface-2); color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
.ledger > .ch { background: var(--surface-2); font-weight: 700; border-top: 0; }
.ledger > .ch.me { color: var(--accent); }
.ledger .god { color: var(--muted); }
.ledger .god.me { color: var(--accent); font-weight: 700; }
.glyph { padding: 8px 4px !important; }
.glyph .g { width: 100%; max-width: 76px; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; align-content: center; gap: 0; }
.glyph .g .hj { font-family: var(--font-display); font-weight: 900; font-size: clamp(26px, 6vw, 38px); line-height: 1.05; }
.glyph .g .ko { font-size: 12px; opacity: 0.85; }
.glyph .none { color: var(--muted); font-size: 12px; }
.el-목 { background: var(--wood-bg); color: var(--wood); }
.el-화 { background: var(--fire-bg); color: var(--fire); }
.el-토 { background: var(--earth-bg); color: var(--earth); }
.el-금 { background: var(--metal-bg); color: var(--metal); }
.el-수 { background: var(--water-bg); color: var(--water); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px; }
@media (max-width: 680px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.label { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 44px 1fr 20px; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 999px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; }
.fill.목 { background: var(--wood); } .fill.화 { background: var(--fire); } .fill.토 { background: var(--earth); } .fill.금 { background: var(--metal); } .fill.수 { background: var(--water); }
.luck { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.lk { flex: 0 0 auto; width: 58px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px 6px; display: grid; gap: 2px; justify-items: center; font-size: 11px; color: var(--muted); }
.lk.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.lk .age { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.lk .c { font-family: var(--font-display); font-weight: 900; font-size: 19px; line-height: 1.1; width: 34px; text-align: center; border-radius: 6px; }

/* chat */
.chat { display: grid; gap: 12px; }
.who-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tog { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.tog[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.thread { display: grid; gap: 10px; }
.msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; min-width: 0; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { justify-self: start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.assistant h3, .msg.assistant h4 { font-family: var(--font-display); font-size: 16px; margin: 10px 0 4px; }
.msg.assistant p + p, .msg.assistant ul, .msg.assistant ol { margin-top: 6px; }
.msg.assistant ul, .msg.assistant ol { margin-bottom: 0; padding-left: 20px; }
.msg.assistant :first-child { margin-top: 0; }
.msg.err { background: var(--warn-bg); color: var(--warn); }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; }
.sug { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; text-align: left; }
.sug:hover { background: var(--accent-soft); }
.ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.ask textarea { width: 100%; min-height: 48px; max-height: 200px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--surface); }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 10px 18px; font-weight: 700; }
.primary:disabled { opacity: 0.5; cursor: default; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 14px; }
.ghost:hover { border-color: var(--accent); }
.chat-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.typing { color: var(--muted); font-size: 13px; }

/* form */
.form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 500; }
.field input[type="text"], .field input[type="number"], .field input[type="time"], .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.date3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 6px 14px; cursor: pointer; font-size: 14px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.adv[open] summary { margin-bottom: 8px; }
.form-err { color: var(--seal); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 8px; font-size: 14px; }

/* chat-mode dialog */
.back { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.dlg { background: var(--surface); border-radius: 14px; padding: 18px; width: min(640px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; }
.dlg textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface-2); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .msg { animation: in 0.18s ease-out; } @keyframes in { from { transform: translateY(4px); } } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">命</span>
      <div>
        <h1>사주 노트</h1>
        <p class="muted small">가족·동료의 사주를 만세력으로 풀고, 그 사주를 바탕으로 무엇이든 물어보세요.</p>
      </div>

    <aside class="people" aria-label="사람 목록">
      <div class="people-list" id="peopleList"></div>
      <button class="add" id="addBtn" type="button">+ 사람 추가</button>
      <p class="note" id="privacyNote">넣은 생년월일과 대화는 나만 볼 수 있게 저장돼요.</p>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<script>
(() => {
  // ---------- 만세력: 절기·합삭을 직접 계산 (Meeus), 시간대는 Intl(IANA)로 서머타임·표준시 변경까지 반영 ----------
  const SAJU = (() => {
    const STEM = "甲乙丙丁戊己庚辛壬癸", STEM_KO = "갑을병정무기경신임계";
    const BR = "子丑寅卯辰巳午未申酉戌亥", BR_KO = "자축인묘진사오미신유술해";
    const EL = ["목", "화", "토", "금", "수"], EL_HJ = "木火土金水";
    const STEM_EL = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4];
    const BR_EL = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4];
    const BR_ANIMAL = ["쥐", "소", "호랑이", "토끼", "용", "뱀", "말", "양", "원숭이", "닭", "개", "돼지"];
    // 지장간 (여기·중기·정기 순, 마지막이 정기)
    const HIDDEN = [[8, 9], [9, 7, 5], [4, 2, 0], [0, 1], [1, 9, 4], [4, 6, 2], [2, 5, 3], [3, 1, 5], [4, 8, 6], [6, 7], [7, 3, 4], [4, 0, 8]];
    const GODS = [["비견", "겁재"], ["식신", "상관"], ["편재", "정재"], ["편관", "정관"], ["편인", "정인"]];
    const STAGES = ["장생", "목욕", "관대", "건록", "제왕", "쇠", "병", "사", "묘", "절", "태", "양"];
    const SAENG = [11, 6, 2, 9, 2, 9, 5, 0, 8, 3]; // 천간별 장생 지지
    const rad = Math.PI / 180;
    const mod = (a, n) => ((a % n) + n) % n;

    // ---- 천문 ----
    const jdFromMs = (ms) => ms / 864e5 + 2440587.5;
    const msFromJd = (jd) => (jd - 2440587.5) * 864e5;
    function deltaT(y) { // 초
      const t = y - 2000;
      if (y >= 2005) return 62.92 + 0.32217 * t + 0.005589 * t * t;
      if (y >= 1986) return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5;
      if (y >= 1961) { const u = y - 1975; return 45.45 + 1.067 * u - u * u / 260 - u ** 3 / 718; }
      if (y >= 1941) { const u = y - 1950; return 29.07 + 0.407 * u - u * u / 233 + u ** 3 / 2547; }
      if (y >= 1920) { const u = y - 1920; return 21.2 + 0.84493 * u - 0.0761 * u * u + 0.0020936 * u ** 3; }
      return 0;
    }
    // 태양 겉보기 황경 (도), jde = 역학시 율리우스일
    function sunLon(jde) {
      const T = (jde - 2451545) / 36525;
      const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
      const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * rad;
      const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
      const om = (125.04 - 1934.136 * T) * rad;
      return mod(L0 + C - 0.00569 - 0.00478 * Math.sin(om), 360);
    }
    const sunLonAtMs = (ms) => sunLon(jdFromMs(ms) + deltaT(new Date(ms).getUTCFullYear()) / 86400);
    // 태양 황경이 target이 되는 순간(UTC ms), guessMs 근처
    function termMs(target, guessMs) {
      let ms = guessMs;
      for (let i = 0; i < 8; i++) {
        const d = mod(target - sunLonAtMs(ms) + 180, 360) - 180;
        ms += d / 360 * 365.2422 * 864e5;
        if (Math.abs(d) < 1e-6) break;
      }
      return ms;

  // ---------- chart ----------
  const godCls = (g) => "god" + (g === "일간(나)" ? " me" : "");

    L.append(el("div", "rh ch", ""));

  function factsOf(p, r) {
    const pl = placeOf(p.place);

    const lun = r.lunar ? `음력 ${r.lunar.y}.${r.lunar.leap ? "윤" : ""}${pad(r.lunar.m)}.${pad(r.lunar.d)}` : "";
    let t = "태어난 시각 모름";
    if (r.time) {
      if (r.correct) {
        const diff = Math.round(pl.lon * 4 - r.offset);

        t = `${r.time} → 태양시 ${r.local} (${pl.name} 경도 보정 ${diff > 0 ? "+" : ""}${diff}분${dst ? ", 서머타임 기간" : ""})`;

  // ---------- 대화 ----------

  function personText(p) {

  ${pil}

  function contextText() {

    const ps = chatWith.map((id) => people.find((p) => p.id === id)).filter(Boolean);
    const me = people.find((p) => p.rel === "나");
    return `너는 따뜻하고 노련한 한국 명리학(사주팔자) 상담가야. 아래 원국·대운·세운은 페이지가 만세력으로 정확히 계산한 값이니 다시 계산하지 말고 그대로 근거로 써.
오늘: ${TODAY.y}-${pad(TODAY.m)}-${pad(TODAY.d)} (세운 ${T[3].hj}년, 월운 ${T[2].hj}월, 일진 ${T[1].hj}일)
이 대화를 보는 사람: ${me ? `${me.name}(‘나’로 등록)` : "사용자"}. 관계는 이 사람 기준이야.

[대화에 넣은 사람]
${ps.map(personText).join("\n\n")}

[답하는 법]
- 한국어로, 상대가 바로 써먹을 수 있게 구체적으로. 판단마다 근거(어떤 글자·십성·오행·합충·대운/세운 때문인지)를 짧게 붙여.
- 길이는 질문에 맞게. 보통 5~12문장, 필요하면 ### 소제목과 - 목록. 표는 쓰지 마.
- 두 사람 이상이면 일간 관계, 오행 보완, 합·충·형, 십성 관계로 궁합을 봐.
- 시각 모르는 사람은 시주 없이 본다고 한 번만 밝혀.
- 겁주거나 단정하는 예언은 하지 마. 건강·법률·돈 문제는 사주상 경향으로만 말하고 필요하면 전문가를 권해.
- 마지막 줄에 "이어서 물어보기:"를 쓰고, 그 아래 이 사람이 이어서 물어볼 만한 짧은 질문 3개를 "- "로 적어.`;
  }
  function splitSugs(text) {
    const m = text.match(/\**이어서 물어보기\**\s*:?\**/);
    if (!m) return { body: text, sugs: [] };
    const i = m.index;
    const tail = text.slice(i + m[0].length).split("\n").map((l) => l.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, "").trim()).filter(Boolean).slice(0, 4);
    return { body: text.slice(0, i).trim(), sugs: tail };
  }
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function md(text) { // 굵게·소제목·목록만
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    let html = "", list = null;
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of text.split("\n")) {
      const l = raw.trimEnd();
      let m;
      if (!l.trim()) { close(); continue; }
      if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); html += `<h3>${inline(m[1])}</h3>`; }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else { close(); html += `<p>${inline(l)}</p>`; }
    }
    close(); return html;
  }
  function starterSugs() {
    const ps = chatWith.map((id) => people.find((p) => p.id === id)).filter(Boolean);
    if (ps.length >= 2) return [`${ps.map((p) => p.name).join("·")}의 궁합은 어때요?`, "서로 잘 맞는 점과 부딪히기 쉬운 점은?", "함께 지낼 때 서로 조심하면 좋은 건?", "올해 이 관계의 흐름은?"];
    const p = ps[0]; if (!p) return [];
    const n = p.rel === "나" ? "내" : `${p.name}의`;
    const byRel = {
      나: ["내 타고난 성격과 강점은?", "올해와 내년 운의 흐름은?", "나에게 맞는 일과 직업 방향은?", "지금 대운에서 조심할 점은?"],
      아이: [`${p.name}의 기질과 잘 키우는 방법은?`, "공부 스타일과 잘 맞는 진로 방향은?", "올해 아이에게 신경 써 줄 부분은?", "칭찬과 훈육은 어떻게 하면 좋을까?"],
      동료: [`${p.name}님과 일할 때 잘 맞는 방식은?`, "이 사람의 업무 강점과 약점은?", "갈등이 생기면 어떻게 풀까?", "이 사람에게 부탁할 때 요령은?"],
      상사: [`${p.name}님은 어떤 보고 방식을 좋아할까?`, "이 상사와 잘 지내는 요령은?", "올해 이 사람의 운 흐름은?"],
    };
    return byRel[p.rel] || [`${n} 성격과 강점은?`, `${n} 올해 운은 어때요?`, "이 사람과 잘 지내려면?", "요즘 이 사람이 신경 쓰는 일은?"];
  }
  function renderChatArea() {
    const box = $("chatBox"); if (!box) return;
    box.replaceChildren();
    if (!people.length) { box.append(el("p", "muted", "사람을 한 명 이상 넣으면, 그 사주를 바탕으로 무엇이든 이어서 물어볼 수 있어요.")); return; }
    const pick = el("div", "who-pick"); pick.append(el("span", "small muted", "대화에 넣을 사람"));
    for (const p of sorted()) {
      const b = el("button", "tog", p.name); b.type = "button"; b.setAttribute("aria-pressed", String(chatWith.includes(p.id)));
      b.onclick = () => { if (streaming) return; const on = chatWith.includes(p.id); const next = on ? chatWith.filter((x) => x !== p.id) : [...chatWith, p.id]; if (next.length) setChatWith(next); };
      pick.append(b);
    }
    box.append(pick);
    const th = el("div", "thread"); th.id = "thread"; th.setAttribute("aria-live", "polite");
    for (const m of messages) {
      const b = el("div", "msg " + m.role);
      if (m.role === "assistant") b.innerHTML = md(m.content); else b.textContent = m.content;
      th.append(b);
    }
    if (streaming) {
      const b = el("div", "msg assistant"); b.id = "live";
      if (streaming.text) b.innerHTML = md(splitSugs(streaming.text).body); else b.append(el("span", "typing", "사주를 읽는 중…"));
      th.append(b);
    }
    box.append(th);
    const list = streaming ? [] : (messages.length ? sugs : starterSugs());
    if (list.length) {
      const s = el("div", "sugs");
      list.forEach((t) => { const b = el("button", "sug", t); b.type = "button"; b.onclick = () => send(t); s.append(b); });
      box.append(s);
    }
    const form = el("form", "ask");
    const ta = el("textarea"); ta.id = "q"; ta.rows = 2; ta.placeholder = "무엇이든 물어보세요. 예: 이번 이직, 지금 해도 될까요?"; ta.setAttribute("aria-label", "질문");
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
    const btn = el("button", "primary", streaming ? "멈추기" : "묻기"); btn.type = "submit";
    form.append(ta, btn);
    form.onsubmit = (e) => { e.preventDefault(); if (streaming) { streaming.ctl?.abort(); return; } const t = ta.value.trim(); if (t) { ta.value = ""; send(t); } };
    box.append(form);
    const foot = el("div", "chat-foot");
    foot.append(el("span", "", sample?.manual ? "이 계정에서는 Claude 채팅에 붙여넣어 답을 받아와요." : "앞 대화를 기억하고 이어서 답해요."));
    if (messages.length && !streaming) {
      const clr = el("button", "linkbtn", "새 대화"); clr.type = "button";
      clr.onclick = async () => { messages = []; sugs = []; renderChatArea(); try { await store.setChat(chatKey, { messages: [], sugs: [], people: chatWith, updatedAt: new Date().toISOString() }); } catch {} };
      foot.append(clr);
    }
    box.append(foot);
  }
  async function saveChat() {
    try { await store.setChat(chatKey, { messages: messages.slice(-80), sugs, people: chatWith, updatedAt: new Date().toISOString() }); }
    catch { setStatus("대화를 저장하지 못했어요. 이 화면을 닫으면 사라질 수 있어요.", true); }
  }
  function errText(e) {
    const c = e?.code;
    if (c === "not_granted") return "Claude 사용 권한이 꺼져 있어요. 페이지 메뉴의 권한 설정에서 허용해 주세요.";
    if (c === "rate_limited") return "요청이 많아요. 잠시 후 다시 물어봐 주세요.";
    if (c === "cancelled") return "멈췄어요.";
    return "답을 받지 못했어요. 다시 물어봐 주세요." + (e?.message ? ` (${e.message})` : "");
  }
  async function send(q) {
    if (streaming || !chatWith.length || !sample) return;
    const key = chatKey;
    messages.push({ role: "user", content: q }); sugs = [];
    const hist = messages.slice(-17, -1).map((m) => ({ role: m.role, content: m.content }));
    while (hist.length && hist[0].role !== "user") hist.shift();
    const input = [...hist, { role: "user", content: `${contextText()}\n\n[질문]\n${q}` }];
    streaming = { text: "", ctl: new AbortController() };
    let wake = null; navigator.wakeLock?.request("screen").then((l) => { wake = l; }).catch(() => {});
    renderChatArea(); scrollDown();
    const live = () => $("live");
    try {
      const res = sample.manual
        ? await askViaChat(input)
        : await sample(input, { cache: false, signal: streaming.ctl.signal, onText: ({ text }) => { streaming.text = text; const b = live(); if (b) b.innerHTML = md(splitSugs(text).body); } });
      const { body, sugs: s } = splitSugs(res.text || "");
      if (key === chatKey) { messages.push({ role: "assistant", content: body + (res.truncated ? "\n\n(답이 길어서 여기서 끊겼어요. ‘계속’이라고 물어보세요.)" : "") }); sugs = s; }
    } catch (e) {
      const partial = e?.text ? splitSugs(e.text).body : "";
      if (key === chatKey) messages.push({ role: "assistant", content: (partial ? partial + "\n\n" : "") + "(" + errText(e) + ")" });
    } finally {
      streaming = null; wake?.release?.().catch?.(() => {});
      if (key === chatKey) { renderChatArea(); scrollDown(); await saveChat(); }
    }
  }
  const scrollDown = () => { const t = $("thread"); t?.lastElementChild?.scrollIntoView({ block: "nearest", behavior: "smooth" }); };

  // Claude를 페이지에서 부를 수 없는 계정: 부탁 글을 복사해 Claude 채팅에 붙여넣고, 답을 다시 붙여넣기
  function askViaChat(input) {
    return new Promise((resolve, reject) => {
      const prompt = input.map((m) => (m.role === "user" ? "[나]\n" : "[상담가]\n") + m.content).join("\n\n") + "\n\n위 마지막 [질문]에 상담가로 답해 줘.";
      const back = el("div", "back"); const box = el("div", "dlg"); box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Claude 채팅으로 묻기");
      box.append(el("h3", "", "Claude 채팅으로 묻기"), el("p", "small muted", "1) 아래 글을 복사해 Claude 채팅에 붙여넣고, 2) 받은 답을 그대로 아래 칸에 붙여넣으세요."));
      const ta = el("textarea"); ta.id = "chatPrompt"; ta.readOnly = true; ta.value = prompt;
      const copy = el("button", "ghost", "부탁 글 복사"); copy.type = "button";
      copy.onclick = async () => { try { await navigator.clipboard.writeText(prompt); copy.textContent = "복사했어요"; } catch { ta.select(); copy.textContent = "선택했어요. 복사해 주세요"; } };
      const ans = el("textarea"); ans.id = "chatAnswer"; ans.placeholder = "Claude 답을 여기에 붙여넣기"; ans.setAttribute("aria-label", "Claude 답");
      const row = el("div", "row"); const ok = el("button", "primary", "답 넣기"); ok.type = "button"; const no = el("button", "linkbtn", "취소"); no.type = "button";
      row.append(ok, no);
      box.append(ta, copy, ans, row); back.append(box); document.body.append(back); copy.focus();
      const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
      const onKey = (e) => { if (e.key === "Escape") { close(); reject({ code: "cancelled" }); } };
      document.addEventListener("keydown", onKey);
      no.onclick = () => { close(); reject({ code: "cancelled" }); };
      ok.onclick = () => { const t = ans.value.trim(); if (!t) { ans.focus(); return; } close(); resolve({ text: t }); };
    });
  }

  // ---------- render ----------
  function renderAll() {
    renderPeople();
    const main = $("main"); main.replaceChildren();
    if (editing) { main.append(renderForm()); return; }
    const p = cur();
    if (!p) { selId = sorted()[0]?.id; return renderAll(); }
    main.append(renderChart(p));
    const chat = el("section", "panel chat"); chat.setAttribute("aria-label", "물어보기");
    chat.append(el("h2", "", "물어보기"));
    const box = el("div", "chat"); box.id = "chatBox"; chat.append(box);
    main.append(chat);
    renderChatArea();
  }
  $("addBtn").onclick = () => openForm();

  // ---------- boot ----------
  renderAll();
  (async () => {
    const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const [d, s, u] = await Promise.all([use("db"), use("sample"), use("user")]);
    sample = s || { manual: true };
    const id = d && u ? await u.id().catch(() => null) : null;
    if (d && id) { db = d; base = `data/users/${id}/app`; }
    else $("privacyNote").textContent = "넣은 내용은 이 브라우저에만 저장돼요.";
    let first = true;
    store.watchPeople((list) => {
      people = list;
      if (first) { first = false; let saved = null; try { saved = localStorage.getItem("saju:sel"); } catch {} selId = people.some((p) => p.id === saved) ? saved : sorted()[0]?.id || null; if (selId) setChatWith([selId]); }
      if (!people.some((p) => p.id === selId)) selId = sorted()[0]?.id || null;
      const keep = chatWith.filter((id) => people.some((p) => p.id === id));
      if (keep.length !== chatWith.length || (!keep.length && selId)) setChatWith(keep.length ? keep : [selId]);
      if (!editing) renderAll(); else renderPeople();
    });
    setStatus(sample.manual ? "이 계정에서는 페이지가 Claude를 바로 부를 수 없어서, 질문하면 Claude 채팅에 붙여넣는 방식으로 진행돼요." : "");
  })();
})();
</script>
